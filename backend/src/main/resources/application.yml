spring:
  application:
    name: gowize-backend
  # Default profile: in-memory H2 so the app runs with zero external setup.
  datasource:
    url: jdbc:h2:mem:gowize;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${REMINDLY_S3_BUCKET:}

# Origins allowed to call the API (the PWA, dev + prod).
gowize:
  cors:
    allowed-origins: >-
      http://localhost:5173,http://localhost:5174,https://gowize.pro,https://www.gowize.pro
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-32-chars-min}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

gowize:
  mail:
    from: ${MAIL_FROM:${spring.mail.username}}

---
# Production profile: Postgres (RDS). Activate with SPRING_PROFILES_ACTIVE=prod.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
