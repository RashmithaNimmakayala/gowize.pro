spring:
  application:
    name: gowize-backend
  # Default profile: in-memory H2 so the app runs with zero external setup.
  datasource:
    url: jdbc:h2:mem:gowize;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${REMINDLY_S3_BUCKET:}

# Vision-LLM photo extraction (replaces Textract OCR). Key comes from an env
# var only — never commit a real value here.
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:anthropic/claude-sonnet-4}
  base-url: https://openrouter.ai/api/v1/chat/completions

# Origins allowed to call the API (the PWA, dev + prod).
gowize:
  cors:
    allowed-origins: >-
      http://localhost:5173,http://localhost:5174,https://gowize.pro,https://www.gowize.pro

---
# Production profile: Postgres (RDS). Activate with SPRING_PROFILES_ACTIVE=prod.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
